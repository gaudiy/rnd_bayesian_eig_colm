# config_qwen30b.yaml
# Configuration for Qwen3-30B-A3B-Instruct-2507 experiments via vLLM
# Run: python run_gpus_vllm.py --config config_qwen30b.yaml

# -------------------------
# Model configuration
# -------------------------
model_name: Qwen/Qwen3-30B-A3B-Instruct-2507   # must match the ID used when starting vLLM

# -------------------------
# vLLM server
# -------------------------
vllm_base_url: "http://localhost:8234/v1"  # adjust port if you used a different one

# -------------------------
# System settings
# -------------------------
system:
  queue_dir: "task_queue_qwen30b"   # separate queue from other runs
  n_workers: 32                      # concurrent worker processes hitting vLLM
                                    # more workers = more concurrent requests = better GPU util
                                    # 4-8 is a good range for one A100

# -------------------------
# Data settings
# -------------------------
data:
  data_path: "mimic_data.csv"
  disease_mapping_path: "disease_mapping.json"
  disease_list_path: "top_n_target_labels.txt"
  output_dir: "results_qwen30b"

mimic:
  n_diseases_num: 500
  n_top_diseases_num: 100
  n_patients_num: 1000
  random_select_seed: 77
  data_source_folder: "physionet.org/files/mimic-iv-ed/2.2/ed"

# -------------------------
# Experiment parameters
# -------------------------
experiment:
  start_idx: 0
  end_idx: 200                      # 200 patients 

  max_questions: 15
  confidence_threshold: 0.9

  question_cost: 15
  question_num: 3
  test_num: 3

  stagnation_threshold: 0.15
  stagnation_window: 1
  stagnation_exit_threshold: 0.4

  uniform_prior: false
  use_pruning: false

  concentration_threshold: 0.90
  concentration_top_perc: 0.2

  pd_top_perc: 0.2

  top_to_show_when_contrastive: 10  # unused (computed dynamically)
  top_to_show_when_contrastive_perc: 0.95

  # -------------------------
  # Conditions to run
  # -------------------------
  conditions_to_run:
    - EIG-COST-AWARE
    - TRUNCATED-PD-COST-AWARE
    - TRUNCATED-PD-EIG-COST-AWARE
    - ADAPTIVE-PD-COST-AWARE
